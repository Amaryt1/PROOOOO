name: Check original GTA5 Mods download link compatibility
on:
  push:
    paths: ['.github/workflows/probe-original-mod-downloads.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect link headers without downloading mod archives
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,re,html
          urls=[
            'https://www.gta5-mods.com/vehicles/toyota-hilux-glx-2021-add-on-fivem',
            'https://www.gta5-mods.com/vehicles/toyota-hilux-glx-2021-add-on-fivem/download/157225',
            'https://www.gta5-mods.com/vehicles/toyota-land-cruiser-gxr-2020-add-on'
          ]
          for u in urls:
            print('\nURL:',u,flush=True)
            for method in ['HEAD','GET']:
              request=urllib.request.Request(u,method=method,headers={'User-Agent':'Mozilla/5.0 (compatible; ModCompatibilityCheck/1.0)'})
              try:
                with urllib.request.urlopen(request,timeout=18) as response:
                  print(method,'status=',response.status,'final=',response.url,'mime=',response.headers.get('content-type'),'len=',response.headers.get('content-length'),flush=True)
                  if method=='GET' and 'text/html' in response.headers.get('content-type',''):
                    body=response.read(220000).decode('utf-8','replace')
                    previews=re.findall(r'<meta[^>]+(?:og:image|twitter:image)[^>]*>',body,re.I)[:2]
                    links=re.findall(r'(?:href|data-href)=[\'\"]([^\'\"]+/download/[^\'\"]+)',body)[:3]
                    print('PREVIEWS',previews,'LINKS',links,flush=True)
                  elif method=='GET':
                    print('binary signature:',response.read(8),flush=True)
              except Exception as e:
                print(method,'error:',str(e)[:450],flush=True)
          PY
