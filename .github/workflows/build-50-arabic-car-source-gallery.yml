name: Verify fifty original car sources and Arabic names/photos
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_gta5mods_source_gallery.py'
      - 'research/iraq-gulf-car-sources-seed.json'
      - '.github/workflows/build-50-arabic-car-source-gallery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original page titles photos and download landing URLs
        run: python3 scripts/verify_gta5mods_source_gallery.py
      - name: Commit independent reference gallery without touching mods.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/iraq-gulf-verified-source-gallery.json research/IRAQI-GULF-50-PHOTOS-AND-SOURCES.md
          if ! git diff --staged --quiet; then
            git commit -m "Add 50+ real original vehicle preview images and source links for Arabic mod research"
            git push
          fi
