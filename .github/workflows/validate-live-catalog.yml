name: Validate published mod catalog
on:
  push:
    paths:
      - 'mods.json'
      - 'source/policy.js'
      - 'scripts/test.js'
      - 'scripts/inspect_dlc_zip.py'
      - 'scripts/normalize_addon_zip.py'
      - 'research/iraq-gulf-mod-candidates-ar.json'
      - '.github/workflows/validate-live-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/test.js
      - name: Validate future DLC ZIP format inspector (safe synthetic fixtures)
        run: |
          python3 -m py_compile scripts/inspect_dlc_zip.py
          python3 - <<'PY'
          import pathlib, zipfile, tempfile, subprocess, sys, json
          with tempfile.TemporaryDirectory() as d:
            good=pathlib.Path(d)/"good.zip"
            bad=pathlib.Path(d)/"loose-stream.zip"
            with zipfile.ZipFile(good,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('update/x64/dlcpacks/testcar/dlc.rpf',b'7FPR'+b'\x00'*256)
            with zipfile.ZipFile(bad,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('stream/testcar.yft',b'RSC7'+b'\x00'*256)
            ok=subprocess.run([sys.executable,'scripts/inspect_dlc_zip.py',str(good)],capture_output=True,text=True)
            assert ok.returncode==0,ok.stderr
            assert 'testcar' in json.loads(ok.stdout)['dlc_packs']
            fail=subprocess.run([sys.executable,'scripts/inspect_dlc_zip.py',str(bad)],capture_output=True,text=True)
            assert fail.returncode!=0,fail.stdout
            print('DLC ZIP validator passed positive/negative safety tests')
          PY
      - name: Test add-on ZIP normalizer and separate research catalog
        run: |
          python3 -m py_compile scripts/normalize_addon_zip.py
          python3 - <<'PY'
          import json,pathlib,subprocess,sys,tempfile,zipfile
          r=json.loads(pathlib.Path('research/iraq-gulf-mod-candidates-ar.json').read_text())
          assert r['schema']==1 and len(r['candidates'])>=10
          seen=set()
          for candidate in r['candidates']:
            assert candidate['name_ar'] and candidate['source_page'].startswith('https://')
            assert candidate['binary_downloaded'] is False and candidate['ios_auto_install_verified'] is False
            assert candidate['redistribution_permission_verified'] is False
            assert candidate['id'] not in seen
            seen.add(candidate['id'])
          live=json.loads(pathlib.Path('mods.json').read_text())
          assert all(x['id'].startswith('candidate-') is False for x in live['mods'])
          with tempfile.TemporaryDirectory() as d:
            root=pathlib.Path(d)
            valid=root/'original.zip'
            output=root/'normalized.zip'
            invalid=root/'loose-yft.zip'
            with zipfile.ZipFile(valid,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('AddOn/hilux21/dlc.rpf',b'7FPR'+bytes(200))
            with zipfile.ZipFile(invalid,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('stream/car.yft',b'RSC7'+bytes(200))
            ok=subprocess.run([sys.executable,'scripts/normalize_addon_zip.py',str(valid),str(output)],capture_output=True,text=True)
            assert ok.returncode==0,ok.stderr
            with zipfile.ZipFile(output) as z:
              assert z.namelist()==['update/x64/dlcpacks/hilux21/dlc.rpf']
            failure=subprocess.run([sys.executable,'scripts/normalize_addon_zip.py',str(invalid),str(root/'bad.zip')],capture_output=True,text=True)
            assert failure.returncode!=0
          print('PASS: Arabic research catalog isolated; genuine RPF7 Add-on normalized; loose YFT rejected')
          PY
      - name: Check every archive URL matches a released ZIP
        run: |
          python3 - <<'PY'
          import json,urllib.request
          mods=json.load(open('mods.json'))['mods']
          for m in mods:
            if 'archiveURL' not in m:continue
            url=m['archiveURL']
            assert url.startswith('https://github.com/Amaryt1/PROOOOO/releases/download/')
            req=urllib.request.Request(url,method='HEAD',headers={'User-Agent':'AMARYT-mod-catalog-check'})
            with urllib.request.urlopen(req,timeout=20) as r:
              assert r.status==200
              assert r.getheader('Content-Type','').lower().find('text/html')<0, url
            print('Archive URL reachable:',m['id'])
          PY
