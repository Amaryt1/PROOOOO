<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إعدادات AMAR YT</title><style>body{font:17px system-ui;max-width:820px;margin:32px auto;padding:16px}textarea{width:100%;height:55vh;font:14px monospace}button,select,input{margin:4px;padding:7px}</style>
<h1>إعدادات AMAR YT</h1><p>اختر الملف، ثم اقرأ النسخة المنشورة أو افتح نسخة من جهازك. عدّل النص واضغط حفظ. ارفع الملف الناتج إلى فرع main.</p><select id="kind"><option>config.json</option><option>mods.json</option></select><button id="load">قراءة من GitHub</button><input type="file" accept=".json" id="local"><textarea id="editor" dir="ltr" aria-label="JSON"></textarea><button id="save">تحقق واحفظ JSON</button><p id="status" role="status"></p><script src="source/policy.js"></script><script>
const el=id=>document.getElementById(id),msg=t=>el('status').textContent=t;
el('load').onclick=async()=>{try{const r=await fetch('https://raw.githubusercontent.com/Amaryt1/PROOOOO/main/'+el('kind').value,{cache:'no-store'});if(!r.ok)throw Error(r.status);el('editor').value=JSON.stringify(await r.json(),null,2);msg('اكتملت القراءة.')}catch(e){msg(String(e))}};
el('local').onchange=async e=>{if(e.target.files[0])el('editor').value=await e.target.files[0].text()};
el('save').onclick=()=>{try{const text=el('editor').value,name=el('kind').value;if(!acceptsJSON(text,name==='mods.json'))throw Error('راجع الحقول والأسماء والروابط');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(JSON.parse(text),null,2)+'\n'],{type:'application/json'}));link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);msg('تم إنشاء الملف.')}catch(e){msg(String(e))}};
</script></html>
